<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel by pixel, or all at once</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .stage{width:100%;max-width:1400px}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 1600 480" role="img"
       aria-label="Two linear fixtures, the upper one changing between purple and white as a single color, the lower one running a purple to white gradient along its pixels">
    <defs>
      <filter id="bloomS" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <filter id="haze" x="-160%" y="-160%" width="420%" height="420%">
        <feGaussianBlur stdDeviation="26"/>
      </filter>
    </defs>
    <g id="world"></g>
  </svg>
</div>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var world = document.getElementById("world");

  var W = 1600;

  // two identical fixtures, one above the other
  var CY = [110, 370];
  var BAR_X = 0, BAR_W = 1600, BAR_H = 92;
  var NLED = 24, LED_X0 = BAR_X + 20, LED_SPAN = BAR_W - 40;
  var WIN = 40, LIT = 26;

  // the two ends of the mix
  var PURPLE = [181, 92, 255];
  var WHITE  = [255, 255, 255];

  var CYCLES = 1.5;      // how many purple to white runs fit along the top bar
  var SPEED  = 0.75;     // radians per second

  function el(t, a){
    var n = document.createElementNS(NS, t);
    for(var k in a){ n.setAttribute(k, a[k]); }
    return n;
  }

  // mixing two light sources happens in linear light, not in sRGB numbers
  function toLinear(u){ u = u/255; return u <= 0.04045 ? u/12.92 : Math.pow((u+0.055)/1.055, 2.4); }
  function toSRGB(v){
    v = Math.max(0, Math.min(1, v));
    return Math.round(255 * (v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055));
  }
  var LP = PURPLE.map(toLinear), LW = WHITE.map(toLinear);
  function mix(t){
    t = Math.max(0, Math.min(1, t));
    return "rgb(" + toSRGB(LP[0] + (LW[0]-LP[0])*t) + "," +
                    toSRGB(LP[1] + (LW[1]-LP[1])*t) + "," +
                    toSRGB(LP[2] + (LW[2]-LP[2])*t) + ")";
  }

  function buildBar(cy){
    var pitch = LED_SPAN / NLED;
    var lx = [];
    for(var n=0;n<NLED;n++){ lx.push(LED_X0 + pitch*(n+0.5)); }

    // spill first, so it sits around the bar instead of over it
    var hazeGrp = el("g", {filter:"url(#haze)", opacity:"0.42"});
    var hazes = [];
    for(var a=0;a<NLED;a++){
      var hz = el("rect", {x:lx[a]-WIN/2, y:cy-WIN*0.8, width:WIN, height:WIN*1.6});
      hazeGrp.appendChild(hz); hazes.push(hz);
    }
    world.appendChild(hazeGrp);

    world.appendChild(el("rect", {x:BAR_X, y:cy-BAR_H/2, width:BAR_W, height:BAR_H, fill:"#171717"}));

    var bloomGrp = el("g", {filter:"url(#bloomS)", opacity:"0.85"});
    var blooms = [];
    for(var b=0;b<NLED;b++){
      var bb = el("rect", {x:lx[b]-LIT*0.75, y:cy-LIT*0.75, width:LIT*1.5, height:LIT*1.5, rx:4});
      bloomGrp.appendChild(bb); blooms.push(bb);
    }
    world.appendChild(bloomGrp);

    var leds = [];
    for(var c=0;c<NLED;c++){
      var ld = el("rect", {x:lx[c]-LIT/2, y:cy-LIT/2, width:LIT, height:LIT, rx:3});
      world.appendChild(ld); leds.push(ld);
    }

    return {x:lx, leds:leds, blooms:blooms, hazes:hazes};
  }

  var zone = buildBar(CY[0]);    // one value for the whole fixture
  var grad = buildBar(CY[1]);    // every pixel its own value

  function set(bar, i, col){
    bar.leds[i].setAttribute("fill", col);
    bar.blooms[i].setAttribute("fill", col);
    bar.hazes[i].setAttribute("fill", col);
  }

  function paint(phase){
    // top: one value, so the whole fixture crosses from purple to white together
    var col = mix(0.5 + 0.5*Math.sin(phase));
    for(var i=0;i<NLED;i++){ set(zone, i, col); }
    // bottom: the mix travels along the bar, so purple and white are on it at the same moment
    for(var j=0;j<NLED;j++){
      var t = 0.5 + 0.5*Math.sin((grad.x[j]/W) * CYCLES * 2*Math.PI + phase);
      set(grad, j, mix(t));
    }
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){
    paint(0);
  } else {
    var t0 = null;
    function frame(t){
      if(t0 === null){ t0 = t; }
      paint(((t - t0)/1000) * SPEED);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
