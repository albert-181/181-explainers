<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One pixel, many pixels</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ffffff}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .stage{width:100%;max-width:1400px}
  svg{display:block;width:100%;height:auto}

  .housing-out{fill:#171717}
  .knurl{fill:#242424}
  .lens-ring{fill:#2b2b2b}
  .face{fill:#0a0a0a}
  .strap{fill:#1c1c1c}
  .strap-hi{fill:#2e2e2e}
  .tab{fill:#121212}

</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 1600 690" role="img"
       aria-label="Three single pixel modules, a linear fixture with a pixel per lens, and a linear G54 whose lenses light in four groups">
    <defs>
      <filter id="bloom" x="-140%" y="-140%" width="380%" height="380%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <filter id="bloomS" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <filter id="haze" x="-160%" y="-160%" width="420%" height="420%">
        <feGaussianBlur stdDeviation="26"/>
      </filter>

    </defs>
    <g id="world"></g>
  </svg>
</div>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var world = document.getElementById("world");

  var W = 1600;

  // ---- row 1: three XT modules, one pixel each
  var MODULES = 3, GAP = 416, X0 = 384, CY1 = 116;
  var R_OUT = 60, R_KNURL = 55, R_LENS = 48, R_FACE = 41;
  var LEDS = 6, R_LED = 25, LED_S = 14;

  // ---- row 2: one linear fixture, many pixels
  var CY2 = 344;
  var BAR_X = 0, BAR_W = 1600, BAR_H = 92;   // edge to edge, same run as the strap above
  var NLED = 24, LED_X0 = BAR_X + 20, LED_SPAN = BAR_W - 40;
  var WIN = 40, LIT = 26;

  function el(t, a){
    var n = document.createElementNS(NS, t);
    for(var k in a){ n.setAttribute(k, a[k]); }
    return n;
  }

  // one wave crossing the whole canvas, so both rows read the same moment in the same effect
  var CYCLES = 1.5, SPEED = 40;

  // tunable white, swept in mired so the steps read evenly across the range
  var K_WARM = 2200, K_COOL = 7500;
  var M_WARM = 1e6 / K_WARM, M_COOL = 1e6 / K_COOL;
  function cctAt(x, phase){
    var u = (x / W) * CYCLES * 2 * Math.PI + phase * Math.PI / 180;
    var s = 0.5 + 0.5 * Math.sin(u);
    return 1e6 / (M_WARM + (M_COOL - M_WARM) * s);
  }
  // planckian approximation, normalised so the brightest channel always sits at full
  function kelvin2rgb(K){
    var t = Math.max(1000, Math.min(12000, K)) / 100, r, g, b;
    r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661
                : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307);
    var m = Math.max(r, g, b) / 255;
    r = Math.max(0, Math.min(255, r / m));
    g = Math.max(0, Math.min(255, g / m));
    b = Math.max(0, Math.min(255, b / m));
    return "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
  }

  // ================= row 1 =================
  world.appendChild(el("rect", {x:0, y:CY1-15, width:W, height:30, "class":"strap"}));
  world.appendChild(el("rect", {x:0, y:CY1-15, width:W, height:3,  "class":"strap-hi"}));

  var mods = [];
  for(var i=0;i<MODULES;i++){
    var cx = X0 + GAP*i;

    world.appendChild(el("rect", {x:cx-R_OUT-15, y:CY1-23, width:34, height:46, rx:3, "class":"tab"}));
    world.appendChild(el("rect", {x:cx+R_OUT-19, y:CY1-23, width:34, height:46, rx:3, "class":"tab"}));

    var g = el("g", {transform:"translate(" + cx + "," + CY1 + ")"});

    var haze = el("circle", {r:R_FACE, filter:"url(#haze)", opacity:"0.5"});
    g.appendChild(haze);

    g.appendChild(el("circle", {r:R_OUT, "class":"housing-out"}));
    for(var k=0;k<24;k++){
      g.appendChild(el("rect", {x:-3, y:-R_KNURL, width:6, height:8,
        transform:"rotate(" + (k*15) + ")", "class":"knurl"}));
    }
    g.appendChild(el("circle", {r:R_LENS, "class":"lens-ring"}));
    g.appendChild(el("circle", {r:R_FACE, "class":"face"}));

    var bg = el("g", {filter:"url(#bloom)", opacity:"0.9"});
    var blooms = [], chips = [];
    for(var j=0;j<LEDS;j++){
      var tf = "rotate(" + (j*360/LEDS) + ") translate(0," + (-R_LED) + ")";
      var bl = el("rect", {x:-LED_S*0.85, y:-LED_S*0.85, width:LED_S*1.7, height:LED_S*1.7, transform:tf});
      bg.appendChild(bl); blooms.push(bl);
    }
    g.appendChild(bg);
    for(var j2=0;j2<LEDS;j2++){
      var tf2 = "rotate(" + (j2*360/LEDS) + ") translate(0," + (-R_LED) + ")";
      var c = el("rect", {x:-LED_S/2, y:-LED_S/2, width:LED_S, height:LED_S, transform:tf2});
      g.appendChild(c); chips.push(c);
    }

    world.appendChild(g);
    mods.push({cx:cx, chips:chips, blooms:blooms, haze:haze});
  }

  // ================= row 2 =================
  // deliberately flat: one black bar, pixels glowing inside it
  var TOP = CY2 - BAR_H/2;

  var pitch = LED_SPAN / NLED;
  var lx = [];
  for(var n=0;n<NLED;n++){ lx.push(LED_X0 + pitch*(n+0.5)); }

  // light spill, drawn first so it sits around the bar instead of over it
  var hazeGrp = el("g", {filter:"url(#haze)", opacity:"0.42"});
  var hazes = [];
  for(var n2=0;n2<NLED;n2++){
    var hz = el("rect", {x:lx[n2]-WIN/2, y:CY2-WIN*0.8, width:WIN, height:WIN*1.6});
    hazeGrp.appendChild(hz); hazes.push(hz);
  }
  world.appendChild(hazeGrp);

  // the bar
  world.appendChild(el("rect", {x:BAR_X, y:TOP, width:BAR_W, height:BAR_H, fill:"#171717"}));

  // emitters
  var barBloomGrp = el("g", {filter:"url(#bloomS)", opacity:"0.85"});
  var barBlooms = [], barLeds = [];
  for(var n4=0;n4<NLED;n4++){
    var bb = el("rect", {x:lx[n4]-LIT*0.75, y:CY2-LIT*0.75, width:LIT*1.5, height:LIT*1.5, rx:4});
    barBloomGrp.appendChild(bb); barBlooms.push(bb);
  }
  world.appendChild(barBloomGrp);
  for(var n5=0;n5<NLED;n5++){
    var ld = el("rect", {x:lx[n5]-LIT/2, y:CY2-LIT/2, width:LIT, height:LIT, rx:3});
    world.appendChild(ld); barLeds.push(ld);
  }

  // ================= row 3 =================
  // a linear G54: round lenses, driven in four groups rather than one by one
  var CY3 = 560, R_G = 18;
  var GROUPS = 4, PER = NLED / GROUPS;

  var hazeGrp3 = el("g", {filter:"url(#haze)", opacity:"0.42"});
  var hazes3 = [];
  for(var h3=0;h3<NLED;h3++){
    var hz3 = el("circle", {cx:lx[h3], cy:CY3, r:WIN*0.62});
    hazeGrp3.appendChild(hz3); hazes3.push(hz3);
  }
  world.appendChild(hazeGrp3);

  world.appendChild(el("rect", {x:BAR_X, y:CY3-BAR_H/2, width:BAR_W, height:BAR_H, fill:"#171717"}));

  var gBloomGrp = el("g", {filter:"url(#bloomS)", opacity:"0.85"});
  var gBlooms = [], gLeds = [];
  for(var b3=0;b3<NLED;b3++){
    var bb3 = el("circle", {cx:lx[b3], cy:CY3, r:R_G*1.35});
    gBloomGrp.appendChild(bb3); gBlooms.push(bb3);
  }
  world.appendChild(gBloomGrp);
  for(var l3=0;l3<NLED;l3++){
    var ld3 = el("circle", {cx:lx[l3], cy:CY3, r:R_G});
    world.appendChild(ld3); gLeds.push(ld3);
    world.appendChild(el("circle", {cx:lx[l3], cy:CY3, r:R_G+3.5,
      fill:"none", stroke:"rgba(255,255,255,.10)", "stroke-width":1.5}));
  }

  // where each group sits, so its colour is sampled from the same wave
  var gx = [];
  for(var q=0;q<GROUPS;q++){
    var sum = 0;
    for(var k2=0;k2<PER;k2++){ sum += lx[q*PER + k2]; }
    gx.push(sum / PER);
  }

  // ================= paint =================
  function paint(phase){
    for(var i=0;i<mods.length;i++){
      var m = mods[i];
      var col = kelvin2rgb(cctAt(m.cx, phase));
      for(var j=0;j<m.chips.length;j++){
        m.chips[j].setAttribute("fill", col);
        m.blooms[j].setAttribute("fill", col);
      }
      m.haze.setAttribute("fill", col);
    }
    for(var n=0;n<NLED;n++){
      var c = kelvin2rgb(cctAt(lx[n], phase));
      barLeds[n].setAttribute("fill", c);
      barBlooms[n].setAttribute("fill", c);
      hazes[n].setAttribute("fill", c);
    }
    for(var q2=0;q2<GROUPS;q2++){
      var gc = kelvin2rgb(cctAt(gx[q2], phase));
      for(var k3=0;k3<PER;k3++){
        var idx = q2*PER + k3;
        gLeds[idx].setAttribute("fill", gc);
        gBlooms[idx].setAttribute("fill", gc);
        hazes3[idx].setAttribute("fill", gc);
      }
    }
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){
    paint(0);
  } else {
    var t0 = null;
    function frame(t){
      if(t0 === null){ t0 = t; }
      paint(((t - t0)/1000) * SPEED);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
