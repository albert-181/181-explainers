:root{
  --ink:#000000;
  --paper:#ffffff;
  --signal:#000080;
  --line-w:2px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;min-height:100%}
html[data-bg="white"]{background:#ffffff}

body{
  color:var(--ink);
  font-family:'Telegraf',system-ui,sans-serif;
  font-weight:400;
  min-height:100vh;
  display:flex;
  align-items:center;
  overflow-x:hidden;
  padding:clamp(14px,2.2vw,34px);
}

.frame{
  width:100%;max-width:1440px;margin:0 auto;
  --gp:clamp(12px,1.5vw,24px);
}

.rule-top{height:var(--line-w);background:currentColor;width:100%}

.panels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin:0 calc(-1 * var(--gp)) 0 calc(-1 * var(--gp) - var(--line-w));
}
.p{
  padding:clamp(14px,1.6vw,26px) var(--gp) clamp(10px,1.2vw,18px);
  border-left:var(--line-w) solid currentColor;
  min-width:0;
}
.p:first-child{border-left:var(--line-w) solid transparent}

h2{
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-weight:500;
  letter-spacing:-0.025em;
  line-height:1;
  font-size:clamp(24px,2.3vw,44px);
}
.claim{
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-weight:500;
  letter-spacing:-0.02em;
  line-height:1.14;
  font-size:clamp(15px,1.25vw,23px);
  margin:clamp(8px,.9vw,14px) 0 clamp(12px,1.2vw,20px);
  min-height:2.28em;
}
canvas{
  display:block;width:100%;height:auto;margin-bottom:4px;
  cursor:ew-resize;
  touch-action:none;
}
canvas:focus-visible{outline:var(--line-w) solid currentColor;outline-offset:3px}

.facts{margin-top:clamp(8px,1vw,14px)}
.fact{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:14px;
  padding:clamp(4px,.5vw,8px) 0;
  border-top:var(--line-w) solid currentColor;
}
.fact:last-child{border-bottom:var(--line-w) solid currentColor}
.fact dt{
  font-size:clamp(9px,.62vw,11px);
  letter-spacing:.2em;
  text-transform:uppercase;
  line-height:1.6;
  opacity:.7;
  flex:0 0 auto;
}
.fact dd{font-size:clamp(12px,.92vw,16px);line-height:1.35;text-align:right}
.box{
  display:inline-block;width:10px;height:10px;margin-right:8px;
  border:var(--line-w) solid currentColor;vertical-align:middle;
}
.box.on{background:var(--signal);border-color:var(--signal)}

@media (max-width:860px){
  body{display:block;padding:18px}
  .panels{grid-template-columns:1fr;margin:0}
  .p{border-left:0;padding:16px 0 18px;border-top:var(--line-w) solid currentColor}
  .p:first-child{border-top:0;border-left:0}
  .claim{min-height:0}
}
</style>
</head>
<body>
<div class="frame">
  <div class="rule-top"></div>
  <div class="panels" id="panels"></div>
</div>

<script>
(function(){
"use strict";

var MAX_M = 400;
var MAX_CH = 4096;
var MAX_FPS = 110;
var UNI = 512;

/* FPS by number of universes on the busiest port.
   Source: DiGidot Performance Guide v3.0.1-2, 'Data' IC table, typical row.
   One universe = 512 channels. The guide leaves the cell empty past
   7 universes, which means below 20 FPS. These are steps, not a slope:
   every channel count inside a universe costs the same time. */
var DATA_STEPS = [100,75,50,40,30,25,20];
var DMX_STEPS  = [40];

var CARDS = [
  {
    name:"DMX512",
    claim:"Goes far. Runs out of channels.",
    dist:300, distLabel:"300 m", runNote:"32 DEVICES MAX",
    chLabel:"512", chPrefix:"",
    steps:DMX_STEPS, overText:"not on one line", deadNote:"NO MORE CHANNELS",
    speed:0.16, spacing:22, markLen:9, gap:true, pair:true,
    facts:[
      ["Channels per line","512"],
      ["Refresh","40 FPS"],
      ["Distance","up to 300 m"],
      ["Devices per bus","32 max"],
      ["Wires","2 data + ground"],
      ["Two-way","Yes, with RDM",true],
      ["Fast data","No",false]
    ]
  },
  {
    name:"SPI",
    claim:"All the data you want. Limited distance.",
    dist:10, distLabel:"10 m", runNote:"SHORT RUN ONLY",
    chLabel:"4096", chPrefix:"up to",
    steps:DATA_STEPS, overText:"under 20 FPS",
    speed:0.62, spacing:3, markLen:2, gap:false,
    facts:[
      ["Channels per port","up to 4096"],
      ["Refresh","100 down to 20 FPS"],
      ["Distance","up to 10 m"],
      ["Addressing","position in the chain"],
      ["Wires","1 data + ground"],
      ["Two-way","No",false],
      ["Fast data","Yes",true]
    ]
  },
  {
    name:"PxLNet",
    claim:"The SPI data, at DMX distance.",
    dist:350, distLabel:"350 m",
    chLabel:"4096", chPrefix:"up to",
    steps:DATA_STEPS, overText:"under 20 FPS",
    speed:0.62, spacing:9, markLen:4, gap:false, pair:true,
    facts:[
      ["Channels per port","up to 4096"],
      ["Refresh","100 down to 20 FPS"],
      ["Distance","up to 350 m"],
      ["Addressing","position in the chain"],
      ["Wires","2 data + ground, on CAT"],
      ["Two-way","Yes",true],
      ["Fast data","Yes",true]
    ]
  }
];

var WMIN = 280, WMAX = 620, PAD = 0;

function layout(W){
  var plotH = Math.max(66, Math.min(150, Math.round(W * 0.30)));
  var gTop = 148;
  var gBot = gTop + plotH;
  return {gTop:gTop, gBot:gBot, H:gBot + 25};
}

/* shared drag position, so one drag reads all three panels at once */
var pickCh = 2048;
var touched = false;

function fpsFor(ch, steps){
  if(ch < 1) return steps[0];
  var u = Math.ceil(ch / UNI);
  return u <= steps.length ? steps[u-1] : null;
}

var host = document.getElementById("panels");
var views = [];

CARDS.forEach(function(c){
  var card = document.createElement("section");
  card.className = "p";

  var h = document.createElement("h2");
  h.textContent = c.name;
  card.appendChild(h);

  var cl = document.createElement("p");
  cl.className = "claim";
  cl.textContent = c.claim;
  card.appendChild(cl);

  var cv = document.createElement("canvas");
  cv.setAttribute("role","slider");
  cv.setAttribute("tabindex","0");
  cv.setAttribute("aria-label", c.name + ", channels on the busiest port");
  cv.setAttribute("aria-valuemin","0");
  cv.setAttribute("aria-valuemax", String(MAX_CH));
  card.appendChild(cv);

  var dl = document.createElement("dl");
  dl.className = "facts";
  c.facts.forEach(function(f){
    var row = document.createElement("div");
    row.className = "fact";
    var dt = document.createElement("dt"); dt.textContent = f[0];
    var dd = document.createElement("dd");
    if(f.length > 2){
      var box = document.createElement("span");
      box.className = f[2] ? "box on" : "box";
      dd.appendChild(box);
      dd.appendChild(document.createTextNode(f[1]));
    } else {
      dd.textContent = f[1];
    }
    row.appendChild(dt); row.appendChild(dd);
    dl.appendChild(row);
  });
  card.appendChild(dl);

  host.appendChild(card);
  views.push({cfg:c, cv:cv, ctx:cv.getContext("2d"), scale:1});
});

function css(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function sizeAll(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  views.forEach(function(v){
    var w = v.cv.clientWidth || 320;
    var wl = Math.max(WMIN, Math.min(WMAX, w));
    var ratio = w / wl;
    var L = layout(wl);
    var h = Math.round(L.H * ratio);
    v.cv.width = Math.round(w * dpr);
    v.cv.height = Math.round(h * dpr);
    v.cv.style.height = h + "px";
    v.W = wl; v.L = L;
    v.scale = ratio * dpr;
  });
}

function draw(v,t){
  var c = v.cfg, ctx = v.ctx;
  var W = v.W, L = v.L, H = L.H;
  var ink = css("--ink"), sig = css("--signal");

  ctx.setTransform(v.scale,0,0,v.scale,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineCap = "butt";
  ctx.lineJoin = "round";
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";

  var tiny = "10px 'Telegraf', sans-serif";
  var small = "11px 'Telegraf', sans-serif";
  var big = "500 26px 'Space Grotesk', sans-serif";

  /* ======== band one: the run ======== */
  var boxX = PAD, boxY = 25, boxW = 30, boxH = 22;
  var cableY = boxY + boxH/2;
  var x0 = boxX + boxW + 24;
  var x1 = W;
  var xMax = x1 - 28;
  var span = xMax - x0;

  function xFor(m){ return x0 + (Math.min(m,MAX_M)/MAX_M) * span; }
  var xEnd = xFor(c.dist);
  var runLen = Math.max(xEnd - x0, 3);

  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.strokeRect(boxX+1, boxY+1, boxW-2, boxH-2);

  var yA = c.pair ? cableY - 6 : cableY;
  var yB = cableY + 6;
  function cable(yy){
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(xEnd, yy); ctx.stroke();
  }
  cable(yA);
  if(c.pair) cable(yB);

  if(c.pair){
    ctx.fillStyle = ink; ctx.font = tiny; ctx.globalAlpha = 0.7;
    ctx.textAlign = "right";
    ctx.fillText("D+", x0 - 5, yA + 3.5);
    ctx.fillText("D-", x0 - 5, yB + 3.5);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  }

  ctx.fillStyle = sig;
  var nMarks = Math.max(2, Math.round(runLen / c.spacing));
  for(var i=0;i<nMarks;i++){
    var ph = ((t * c.speed) + i / nMarks) % 1;
    if(c.gap && ph > 0.9) continue;
    var px = x0 + ph * runLen;
    if(px + c.markLen > xEnd) continue;
    ctx.fillRect(px, yA - 1.5, c.markLen, 3);
    if(c.pair) ctx.fillRect(px, yB - 1.5, c.markLen, 3);
  }

  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xEnd, cableY-12); ctx.lineTo(xEnd, cableY+12); ctx.stroke();

  ctx.fillStyle = sig;
  for(var f=0;f<4;f++){
    ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5*Math.sin(t*3.1 - f*0.9));
    ctx.fillRect(xEnd + 6, cableY - 11 + f*6, 5, 4);
  }
  ctx.globalAlpha = 1;

  if(c.runNote){
    ctx.globalAlpha = 0.7; ctx.fillStyle = ink; ctx.font = tiny;
    ctx.textAlign = "right";
    ctx.fillText(c.runNote, x1, cableY - 20);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  }

  ctx.fillStyle = ink; ctx.font = small;
  var lw = ctx.measureText(c.distLabel).width;
  if(xEnd + 14 + lw < x1){ ctx.fillText(c.distLabel, xEnd + 14, cableY + 22); }
  else { ctx.textAlign = "right"; ctx.fillText(c.distLabel, xEnd - 4, cableY + 22); ctx.textAlign = "left"; }

  var ry = 70;
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.moveTo(x0, ry); ctx.lineTo(xMax, ry); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.font = tiny; ctx.fillStyle = ink;
  [0,100,200,300,400].forEach(function(m){
    var mx = xFor(m);
    ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, ry); ctx.lineTo(mx, ry+5); ctx.stroke();
    ctx.globalAlpha = 0.7;
    ctx.textAlign = m === MAX_M ? "right" : (m === 0 ? "left" : "center");
    ctx.fillText(m === MAX_M ? (m + " m") : String(m), mx, ry + 19);
    ctx.textAlign = "left";
  });
  ctx.globalAlpha = 1;

  /* ======== band two: channels against FPS, draggable ======== */
  var numY = 122;
  ctx.fillStyle = ink;
  var nx = PAD;
  if(c.chPrefix){
    ctx.font = small; ctx.globalAlpha = 0.7;
    ctx.fillText(c.chPrefix, nx, numY);
    nx += ctx.measureText(c.chPrefix).width + 5;
    ctx.globalAlpha = 1;
  }
  ctx.font = big;
  ctx.fillText(c.chLabel, nx, numY);

  var gx0 = 26, gx1 = W;
  var gTop = L.gTop, gBot = L.gBot;
  v.gx0 = gx0; v.gx1 = gx1;

  function xCh(ch){ return gx0 + (Math.min(ch,MAX_CH)/MAX_CH) * (gx1-gx0); }
  function yFps(f){ return gBot - (Math.min(f,MAX_FPS)/MAX_FPS) * (gBot-gTop); }

  var fps = fpsFor(pickCh, c.steps);

  ctx.font = small; ctx.fillStyle = ink; ctx.textAlign = "right";
  ctx.fillText(Math.round(pickCh) + " ch · " + (fps === null ? c.overText : fps + " FPS"),
               gx1, numY);
  ctx.textAlign = "left";

  ctx.font = tiny;
  [100,50,20].forEach(function(f){
    var yy = yFps(f);
    ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.16;
    ctx.beginPath(); ctx.moveTo(gx0, yy); ctx.lineTo(gx1, yy); ctx.stroke();
    ctx.globalAlpha = 0.7; ctx.fillStyle = ink;
    ctx.textAlign = "right";
    ctx.fillText(String(f), gx0 - 6, yy + 3);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  });
  ctx.globalAlpha = 0.7; ctx.fillStyle = ink;
  ctx.textAlign = "right";
  ctx.fillText("FPS", gx0 - 6, gTop - 6);
  ctx.textAlign = "left"; ctx.globalAlpha = 1;

  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.moveTo(gx0, gBot); ctx.lineTo(gx1, gBot); ctx.stroke();
  ctx.globalAlpha = 1;

  if(c.deadNote){
    var wallX = xCh(UNI * c.steps.length);
    ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
    ctx.setLineDash([2,5]);
    ctx.beginPath(); ctx.moveTo(wallX, gTop); ctx.lineTo(wallX, gBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.7; ctx.fillStyle = ink; ctx.font = tiny;
    ctx.textAlign = "center";
    ctx.fillText(c.deadNote, (wallX + 8 + gx1) / 2, yFps(85) + 3);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  }

  /* the step line: one flat tread per universe, risers between */
  ctx.strokeStyle = sig; ctx.lineWidth = 2; ctx.globalAlpha = 0.95;
  ctx.beginPath();
  c.steps.forEach(function(f,k){
    var xa = xCh(UNI*k), xb = xCh(UNI*(k+1)), yy = yFps(f);
    if(k === 0) ctx.moveTo(xa, yy); else ctx.lineTo(xa, yy);
    ctx.lineTo(xb, yy);
  });
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* the handle */
  var hx = xCh(Math.min(pickCh, MAX_CH));
  if(fps === null){
    ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.35;
    ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(hx, yFps(72)); ctx.lineTo(hx, gBot); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  } else {
    var hy = yFps(fps);
    ctx.strokeStyle = sig; ctx.lineWidth = 2; ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, gBot); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = sig;
    ctx.fillRect(hx - 5, hy - 5, 10, 10);
  }

  ctx.font = tiny; ctx.fillStyle = ink;
  [0,1024,2048,3072,4096].forEach(function(ch){
    var tx = xCh(ch);
    ctx.globalAlpha = 0.45; ctx.lineWidth = 2; ctx.strokeStyle = ink;
    ctx.beginPath(); ctx.moveTo(tx, gBot); ctx.lineTo(tx, gBot+5); ctx.stroke();
    ctx.globalAlpha = 0.7;
    ctx.textAlign = ch === 0 ? "left" : (ch === MAX_CH ? "right" : "center");
    ctx.fillText(ch === MAX_CH ? (ch + " ch") : String(ch), tx, gBot + 19);
    ctx.textAlign = "left";
  });
  ctx.globalAlpha = 1;

  /* nudge, until the first drag */
  if(!touched){
    ctx.globalAlpha = 0.7; ctx.fillStyle = ink; ctx.font = tiny;
    ctx.textAlign = "center";
    ctx.fillText("DRAG", hx, gTop - 6);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  }
}

/* ---------- drag ---------- */
function commit(ch){
  pickCh = Math.max(0, Math.min(MAX_CH, Math.round(ch)));
  touched = true;
  views.forEach(function(w){
    w.cv.setAttribute("aria-valuenow", String(pickCh));
    w.cv.setAttribute("aria-valuetext", pickCh + " channels");
  });
  redraw();
}

function setFromEvent(v, clientX){
  var rect = v.cv.getBoundingClientRect();
  var ratio = rect.width / v.W;
  var x = (clientX - rect.left) / ratio;
  var f = (x - v.gx0) / (v.gx1 - v.gx0);
  commit(f * MAX_CH);
}

views.forEach(function(v){
  v.cv.addEventListener("pointerdown", function(e){
    v.cv.setPointerCapture(e.pointerId);
    setFromEvent(v, e.clientX);
    e.preventDefault();
  });
  v.cv.addEventListener("pointermove", function(e){
    if(v.cv.hasPointerCapture && v.cv.hasPointerCapture(e.pointerId)) setFromEvent(v, e.clientX);
  });
  v.cv.addEventListener("keydown", function(e){
    var step = e.shiftKey ? 512 : 64, next = null;
    if(e.key === "ArrowRight" || e.key === "ArrowUp") next = pickCh + step;
    else if(e.key === "ArrowLeft" || e.key === "ArrowDown") next = pickCh - step;
    else if(e.key === "Home") next = 0;
    else if(e.key === "End") next = MAX_CH;
    if(next !== null){ commit(next); e.preventDefault(); }
  });
});

/* ---------- clock, for the run band only ---------- */
var t = 0, last = 0;
function frame(now){
  if(!last) last = now;
  t += Math.min((now - last) / 1000, 0.05);
  last = now;
  views.forEach(function(v){ draw(v, t); });
  requestAnimationFrame(frame);
}
function redraw(){ views.forEach(function(v){ draw(v, t); }); }

window.addEventListener("resize", function(){ sizeAll(); redraw(); });

sizeAll();

/* URL option: ?bg=white paints a background instead of staying transparent */
var q = new URLSearchParams(location.search);
if(q.get("bg")) document.documentElement.setAttribute("data-bg", q.get("bg"));

views.forEach(function(v){ v.cv.setAttribute("aria-valuenow", String(pickCh)); });
requestAnimationFrame(frame);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ sizeAll(); redraw(); }); }

})();
</script>
</body>
</html>
