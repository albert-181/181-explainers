<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five ways to make light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --white:#ffffff;
    --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:var(--body);color:var(--black);-webkit-font-smoothing:antialiased}

  .wrap{max-width:1220px;margin:0 auto;padding:16px 24px 20px}

  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;line-height:1.6}
  h1{
    font-family:var(--display);font-weight:500;
    font-size:clamp(26px,3.4vw,42px);line-height:1;letter-spacing:-.03em;margin:8px 0 10px;
  }
  .lede{font-size:clamp(13px,1.1vw,16px);line-height:1.5;max-width:72ch}
  .rule{height:2px;background:var(--black);margin:14px 0 18px}

  .grid{
    display:grid;
    grid-template-columns:1fr 340px 1fr;
    gap:0 20px;
    align-items:stretch;
  }
  .col{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
  #col-left{justify-content:flex-end}
  #stage{align-self:center}

  .panel{
    border-top:2px solid var(--black);
    padding:10px 12px 14px;
    opacity:.42;
    cursor:pointer;
    transition:opacity .22s linear,background .22s linear;
  }
  .panel:hover{opacity:.72}
  .panel.on{opacity:1;cursor:default;background:rgba(0,0,0,.045)}
  .panel .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .panel .name{
    font-family:var(--display);font-weight:500;
    font-size:clamp(17px,1.8vw,24px);line-height:1.05;letter-spacing:-.02em;
  }
  .panel .count{
    font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.08em;white-space:nowrap;
  }
  .panel .spec{font-size:11px;line-height:1.5;margin-top:4px;opacity:.8}
  .panel .note{font-size:10px;line-height:1.4;margin-top:8px;opacity:.7}

  .seg.mini{border-width:1.5px;flex:0 0 auto}
  .seg.mini button{font-size:9px;letter-spacing:.14em;padding:5px 8px}
  .seg.mini button + button{border-left-width:1.5px}

  .ch-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:10px 12px;margin-top:12px}
  .ch .lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;line-height:1.6;white-space:nowrap}
  .ch .val{font-family:var(--display);font-weight:500;font-size:14px;line-height:1.2;margin-top:2px}
  .swatch{display:inline-block;width:8px;height:8px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;display:block;cursor:pointer;margin:4px 0 2px}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--black)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:16px;margin-top:-7px;
    background:var(--c,#000);border:2px solid var(--black);border-radius:0;
  }
  input[type=range]::-moz-range-track{height:2px;background:var(--black)}
  input[type=range]::-moz-range-thumb{
    width:10px;height:14px;background:var(--c,#000);border:2px solid var(--black);border-radius:0;
  }

  .seg{display:inline-flex;border:2px solid var(--black)}
  .seg button{
    font-family:var(--body);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:8px 14px;background:transparent;color:var(--black);border:0;cursor:pointer;line-height:1;
  }
  .seg button + button{border-left:2px solid var(--black)}
  .seg button.on{background:var(--black);color:var(--white)}

  #stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #stage svg{display:block;width:100%;max-width:340px;height:auto}
  .readout{text-align:center}
  .outbar{width:150px;height:16px;margin:0 auto 8px;background:#0a0a0a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .readout .big{
    font-family:var(--display);font-weight:500;
    font-size:clamp(20px,2.3vw,30px);line-height:1.05;letter-spacing:-.01em;
  }
  .readout .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;line-height:1.8;opacity:.75}

  @media (max-width:880px){
    .grid{grid-template-columns:1fr;gap:16px}
    #stage{order:-1}
  }

</style>
</head>
<body>
<div class="wrap">

  <div class="grid">
    <div class="col" id="col-left">
      <div class="panel" id="p-sw" data-tech="sw"></div>
      <div class="panel" id="p-tw" data-tech="tw"></div>
    </div>

    <div id="stage">
      <svg id="pixel" viewBox="0 0 300 300" role="img" aria-label="LED pixel seen from above">
        <defs>
          <filter id="bloom" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
          <filter id="lens" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="16"/>
          </filter>
          <filter id="haze" x="-180%" y="-180%" width="460%" height="460%">
            <feGaussianBlur stdDeviation="30"/>
          </filter>
        </defs>
        <g id="mod"></g>
      </svg>
      <div class="seg" role="group" aria-label="Lens">
        <button type="button" id="btn-chips">Inside</button>
        <button type="button" id="btn-diff" class="on">Diffused</button>
      </div>
      <div class="readout">
        <div class="outbar" id="out-bar"></div>
        <div class="big" id="out-main">&nbsp;</div>
        <div class="sub" id="out-sub">&nbsp;</div>
      </div>
    </div>

    <div class="col">
      <div class="panel" id="p-rgb"   data-tech="rgb"></div>
      <div class="panel" id="p-rgbw"  data-tech="rgbw"></div>
      <div class="panel" id="p-rgbtw" data-tech="rgbtw"></div>
    </div>
  </div>

</div>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";

  // approximate sRGB for a few blackbody color temperatures
  var K2700 = [255,169, 87];
  var K3000 = [255,180,107];
  var K4000 = [255,209,163];
  var K6500 = [255,249,253];

  var TECH = {
    sw: {
      name:"Static white", count:"1 CH",
      spec:"Fixed 3000K. One channel, so the only thing you can change is how bright it is.",
      chans:[{id:"d", lab:"Dim", col:K3000, init:100}]
    },
    tw2: {
      name:"Tunable white", count:"2 CH", tw:true,
      spec:"A warm and a cool chip in one package. Mix them to land anywhere between 2700K and 6500K.",
      chans:[{id:"ww", lab:"Warm", col:K2700, k:2700, init:100},
             {id:"cw", lab:"Cool", col:K6500, k:6500, init:25}]
    },
    tw3: {
      name:"Tunable white", count:"3 CH", tw:true, note:true,
      spec:"Warm, neutral and cool on one three channel IC. The same white range, with the middle of the curve under its own control.",
      chans:[{id:"ww", lab:"Warm",    col:K2700, k:2700, init:70},
             {id:"nw", lab:"Neutral", col:K4000, k:4000, init:55},
             {id:"cw", lab:"Cool",    col:K6500, k:6500, init:20}]
    },
    rgb: {
      name:"RGB", count:"3 CH",
      spec:"Full color from three chips. White has to be mixed, and it is never quite a clean white.",
      chans:[{id:"r", lab:"Red",   col:[255,0,0], init:100},
             {id:"g", lab:"Green", col:[0,255,0], init:30},
             {id:"b", lab:"Blue",  col:[0,0,255], init:0}]
    },
    rgbw: {
      name:"RGBW", count:"4 CH",
      spec:"Color plus a dedicated 4000K white chip, so white is a real white instead of a mix.",
      chans:[{id:"r", lab:"Red",   col:[255,0,0], init:0},
             {id:"g", lab:"Green", col:[0,255,0], init:0},
             {id:"b", lab:"Blue",  col:[0,0,255], init:25},
             {id:"w", lab:"White", col:K4000,     init:85}]
    },
    rgbtw: {
      name:"RGB + TW", count:"5 CH", note:true,
      spec:"Full color and tunable white in one pixel. The most you can ask of a fixture, and the most data per pixel.",
      chans:[{id:"r",  lab:"Red",   col:[255,0,0], init:15},
             {id:"g",  lab:"Green", col:[0,255,0], init:0},
             {id:"b",  lab:"Blue",  col:[0,0,255], init:30},
             {id:"ww", lab:"Warm",  col:K2700,     init:85},
             {id:"cw", lab:"Cool",  col:K6500,     init:20}]
    }
  };

  var PANELS = ["sw","tw","rgb","rgbw","rgbtw"];      // one panel per column entry
  var KEYS   = ["sw","tw2","tw3","rgb","rgbw","rgbtw"];
  var NOTE   = "*Only available for DiGi LED Strips";

  var active = "rgbtw";      // which panel is on
  var twCh = 2;              // the tunable white panel shows 2 or 3 channels
  var diffused = true;
  var level = {};

  // the tunable white panel stands for whichever of its two variants is picked
  function keyOf(panel){ return panel === "tw" ? ("tw" + twCh) : panel; }

  KEYS.forEach(function(t){
    level[t] = {};
    TECH[t].chans.forEach(function(c){ level[t][c.id] = c.init; });
  });

  function rgbStr(c){
    return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")";
  }
  function hex(c){
    return "#" + c.map(function(v){
      var s = Math.round(Math.max(0,Math.min(255,v))).toString(16);
      return s.length < 2 ? "0"+s : s;
    }).join("").toUpperCase();
  }

  // sRGB transfer function, so channels are added as light and not as screen values
  function toLinear(u){
    u = u/255;
    return u <= 0.04045 ? u/12.92 : Math.pow((u+0.055)/1.055, 2.4);
  }
  function toSRGB(v){
    v = Math.max(0, Math.min(1, v));
    return 255 * (v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055);
  }

  // Light adds up linearly, screen values do not. Every chip color is converted to
  // linear light, scaled by its level, summed, and converted back. Over full scale the
  // result rolls off toward white instead of just being divided down, which is closer
  // to what the eye does with a source that is brighter than the screen can show.
  function mix(t){
    var lin = [0,0,0];
    TECH[t].chans.forEach(function(c){
      var L = level[t][c.id] / 100;
      lin[0] += toLinear(c.col[0]) * L;
      lin[1] += toLinear(c.col[1]) * L;
      lin[2] += toLinear(c.col[2]) * L;
    });

    var m = Math.max(lin[0], lin[1], lin[2]);
    if(m > 1){
      var k = 1/m;
      var tw = Math.min(0.8, (m-1)/(m+1));          // highlight desaturation
      for(var i=0;i<3;i++){ lin[i] = (lin[i]*k)*(1-tw) + tw; }
    }

    var bright = Math.pow(Math.min(1, m), 1/2.2);
    return {col:[toSRGB(lin[0]), toSRGB(lin[1]), toSRGB(lin[2])], bright:bright};
  }

  // ---------- panels ----------
  function buildPanel(panel){
    var p = document.getElementById("p-" + panel);
    var t = keyOf(panel);
    var d = TECH[t];

    var right = d.tw
      ? '<span class="seg mini" role="group" aria-label="Tunable white channels">' +
          '<button type="button" data-tw="2"' + (twCh === 2 ? ' class="on"' : '') + '>2 CH</button>' +
          '<button type="button" data-tw="3"' + (twCh === 3 ? ' class="on"' : '') + '>3 CH</button>' +
        '</span>'
      : '<span class="count">' + d.count + '</span>';

    var html = '<div class="head"><span class="name">' + d.name + '</span>' + right + '</div>' +
               '<div class="ch-row">';
    d.chans.forEach(function(c){
      var v = level[t][c.id];
      html += '<div class="ch">' +
                '<div class="lab"><span class="swatch" style="background:' + rgbStr(c.col) + '"></span>' + c.lab + '</div>' +
                '<input type="range" min="0" max="100" value="' + v + '" ' +
                  'data-chan="' + c.id + '" ' +
                  'style="--c:' + rgbStr(c.col) + '" aria-label="' + d.name + ' ' + c.lab + '">' +
                '<div class="val" id="v-' + panel + '-' + c.id + '">' + v + '%</div>' +
              '</div>';
    });
    html += '</div>';
    if(d.note){ html += '<div class="note">' + NOTE + '</div>'; }
    p.innerHTML = html;

    Array.prototype.forEach.call(p.querySelectorAll("input[type=range]"), function(s){
      s.addEventListener("input", function(){
        setActive(panel);
        level[keyOf(panel)][s.dataset.chan] = +s.value;
        document.getElementById("v-" + panel + "-" + s.dataset.chan).textContent = s.value + "%";
        render();
      });
    });
    Array.prototype.forEach.call(p.querySelectorAll("button[data-tw]"), function(b){
      b.addEventListener("click", function(){
        setActive(panel);
        var n = +b.dataset.tw;
        if(n === twCh){ return; }
        twCh = n;
        buildPanel(panel);
        buildModule();
        render();
      });
    });
  }
  PANELS.forEach(function(panel){
    document.getElementById("p-" + panel).addEventListener("click", function(){ setActive(panel); });
    buildPanel(panel);
  });

  function setActive(t){
    if(active === t){ return; }
    active = t;
    PANELS.forEach(function(k){
      document.getElementById("p-" + k).classList.toggle("on", k === t);
    });
    buildModule();
    render();
  }

  // ---------- the pixel ----------
  var mod = document.getElementById("mod");
  var haze, pool, chipEls = [], bloomEls = [];
  var SIZES = {1:{s:50,g:0}, 2:{s:40,g:12}, 3:{s:33,g:10}, 4:{s:28,g:8}, 5:{s:24,g:7}};

  function el(tag, attrs){
    var n = document.createElementNS(NS, tag);
    for(var k in attrs){ n.setAttribute(k, attrs[k]); }
    return n;
  }

  function buildModule(){
    while(mod.firstChild){ mod.removeChild(mod.firstChild); }
    chipEls = []; bloomEls = [];
    var cx = 150, cy = 150;

    // light spilling past the fixture
    haze = el("circle", {cx:cx, cy:cy, r:98, filter:"url(#haze)"});
    mod.appendChild(haze);

    // housing
    mod.appendChild(el("circle", {cx:cx, cy:cy, r:112, fill:"#171717"}));
    for(var k=0;k<28;k++){
      mod.appendChild(el("rect", {x:-5, y:-105, width:10, height:12, fill:"#242424",
        transform:"translate(" + cx + "," + cy + ") rotate(" + (k*360/28) + ")"}));
    }
    mod.appendChild(el("circle", {cx:cx, cy:cy, r:96, fill:"#2b2b2b"}));
    mod.appendChild(el("circle", {cx:cx, cy:cy, r:82, fill:"#080808"}));

    // the diffused output of the whole pixel
    pool = el("circle", {cx:cx, cy:cy, r:74, filter:"url(#lens)"});
    mod.appendChild(pool);

    var chans = TECH[keyOf(active)].chans;
    var n = chans.length;
    var S = SIZES[n].s, G = SIZES[n].g;
    var totalW = n*S + (n-1)*G;
    var x0 = cx - totalW/2;

    var bloomGrp = el("g", {filter:"url(#bloom)", opacity:"0.9"});
    for(var i=0;i<n;i++){
      var x = x0 + i*(S+G);
      bloomEls[i] = el("rect", {x:x - S*0.28, y:cy - S/2 - S*0.28, width:S*1.56, height:S*1.56});
      bloomGrp.appendChild(bloomEls[i]);
    }
    mod.appendChild(bloomGrp);

    for(var i=0;i<n;i++){
      var x = x0 + i*(S+G);
      chipEls[i] = el("rect", {x:x, y:cy - S/2, width:S, height:S});
      mod.appendChild(chipEls[i]);
    }
  }

  function render(){
    var t = keyOf(active);
    var chans = TECH[t].chans;
    var m = mix(t);

    for(var i=0;i<chans.length;i++){
      var L = level[t][chans[i].id] / 100;
      var v = Math.pow(L, 0.5);
      var c = chans[i].col;
      chipEls[i].setAttribute("fill", rgbStr([14 + c[0]*v, 14 + c[1]*v, 14 + c[2]*v]));
      chipEls[i].setAttribute("opacity", diffused ? 0 : 1);
      bloomEls[i].setAttribute("fill", rgbStr([c[0]*L, c[1]*L, c[2]*L]));
      bloomEls[i].setAttribute("opacity", diffused ? 0 : (0.25 + 0.75*L).toFixed(3));
    }

    // frosted lens: one even pool of the mixed light instead of the separate chips
    pool.setAttribute("r", diffused ? 80 : 74);
    pool.setAttribute("fill", rgbStr(m.col));
    pool.setAttribute("opacity", ((diffused ? 0.96 : 0.30) * m.bright).toFixed(3));

    haze.setAttribute("fill", rgbStr(m.col));
    haze.setAttribute("opacity", ((diffused ? 1 : 0.92) * m.bright).toFixed(3));
    document.getElementById("out-bar").style.background = rgbStr(m.col);

    document.getElementById("out-main").textContent = hex(m.col);
    document.getElementById("out-sub").textContent = subLine(t);
  }

  function subLine(t){
    if(t === "sw"){ return "3000K · " + level.sw.d + "% output"; }
    if(TECH[t].tw){
      // white sources blend close to linearly in mired, not in kelvin
      var sum = 0, mired = 0;
      TECH[t].chans.forEach(function(c){
        var L = level[t][c.id];
        sum += L;
        mired += (1e6 / c.k) * L;
      });
      if(sum === 0){ return "off"; }
      var k = Math.round((1e6 / (mired / sum)) / 50) * 50;
      return "approx " + k + "K";
    }
    return TECH[t].chans.map(function(ch){
      return ch.lab.charAt(0) + " " + level[t][ch.id];
    }).join("  ·  ");
  }

  var bChips = document.getElementById("btn-chips");
  var bDiff  = document.getElementById("btn-diff");
  function setLens(d){
    if(diffused === d){ return; }
    diffused = d;
    bChips.classList.toggle("on", !d);
    bDiff.classList.toggle("on", d);
    render();
  }
  bChips.addEventListener("click", function(){ setLens(false); });
  bDiff.addEventListener("click",  function(){ setLens(true); });

  PANELS.forEach(function(k){
    document.getElementById("p-" + k).classList.toggle("on", k === active);
  });
  buildModule();
  render();
})();
</script>
</body>
</html>
