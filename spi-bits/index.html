<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel data, one bit at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --white:#ffffff;
    --blue:#000080;
    --red:#e02020;
    --green:#00a03c;
    --bluech:#1050e0;
    --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--white)}
  body{font-family:var(--body);color:var(--black);-webkit-font-smoothing:antialiased}

  .wrap{max-width:1060px;margin:0 auto;padding:18px 24px 22px}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  .rule{height:2px;background:var(--black);margin:16px 0 4px}
  .rule.thin{height:1px;opacity:.22;margin:15px 0}

  .seg{display:inline-flex;border:2px solid var(--black);flex:0 0 auto}
  .seg button{
    font-family:var(--body);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 15px;background:var(--white);color:var(--black);border:0;cursor:pointer;line-height:1;
  }
  .seg button + button{border-left:2px solid var(--black)}
  .seg button.on{background:var(--black);color:var(--white)}

  svg.wave{display:block;width:100%;height:auto}
  svg.wave.off{display:none}
  .cell-line{stroke:var(--black);stroke-width:1;opacity:.12}
  .grp-line{stroke:var(--black);stroke-width:1;opacity:.38}
  .fill{fill:var(--blue);opacity:0;transition:opacity .15s linear}
  .bit{font-family:var(--display);font-weight:500;fill:var(--black);text-anchor:middle;opacity:0;transition:opacity .15s linear}
  #wave8 .bit{font-size:15px}
  #wave16 .bit{font-size:14px}
  .trace{fill:none;stroke:var(--black);stroke-width:3;stroke-linejoin:miter;stroke-linecap:square}
  .grp-rule{stroke-width:3}
  .grp-label{font-family:var(--body);font-size:12px;letter-spacing:.2em;text-anchor:middle}
  .row-tag{font-family:var(--body);font-size:15px;letter-spacing:.12em}

  .lower{display:flex;flex-wrap:wrap;gap:22px 28px;align-items:flex-start;margin-top:4px}
  .chips{display:flex;gap:14px;flex:1 1 450px;min-width:310px}
  .chip{flex:1 1 0;border-top:3px solid var(--black);padding-top:8px;opacity:.22;transition:opacity .3s linear}
  .chip.on{opacity:1}
  .chip .ch{font-size:10px;letter-spacing:.2em;text-transform:uppercase;line-height:1.6}
  .chip .bin{font-family:var(--display);font-weight:500;font-size:clamp(13px,1.6vw,20px);letter-spacing:.08em;line-height:1.5;white-space:nowrap}
  .chip .dec{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.2vw,40px);line-height:1;letter-spacing:-.02em}
  .chips.b16 .chip .bin{font-size:clamp(10px,1.25vw,15px);letter-spacing:.06em;line-height:1.6}
  .chips.b16 .chip .dec{font-size:clamp(22px,2.9vw,36px)}

  .slider{display:none;margin-top:12px}
  .chips.manual .slider{display:block}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;display:block}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--black)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:16px;margin-top:-7px;
    background:var(--c);border:2px solid var(--black);border-radius:0;
  }
  input[type=range]::-moz-range-track{height:2px;background:var(--black)}
  input[type=range]::-moz-range-thumb{
    width:10px;height:14px;background:var(--c);border:2px solid var(--black);border-radius:0;
  }

  .pixelbox{display:flex;align-items:center;gap:16px;flex:0 0 auto;padding-top:4px}
  .pixel{width:118px;height:118px;position:relative;flex:0 0 auto}
  .emit{position:absolute;inset:0;background:#0d0d0d;transition:background .1s linear,box-shadow .1s linear}
  .pixelbox .cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;line-height:1.7;max-width:110px}


  @media (max-width:700px){
    .wrap{padding:18px 16px}
    #wave8 .bit{font-size:22px}
    #wave16 .bit{font-size:20px}
    .grp-label{font-size:18px}
    .row-tag{font-size:22px}
    .lower{flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="seg" role="group" aria-label="Bit depth">
      <button type="button" id="btn-8" class="on">8 bit</button>
      <button type="button" id="btn-16">16 bit</button>
    </div>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="btn-auto" class="on">Auto scroll</button>
      <button type="button" id="btn-man">Pick a color</button>
    </div>
  </div>

  <div class="rule"></div>

  <svg class="wave" id="wave8" viewBox="0 0 1150 206" role="img"
       aria-label="Twenty four pulses, eight per color channel, forming one pixel color"></svg>
  <svg class="wave off" id="wave16" viewBox="0 0 1150 352" role="img"
       aria-label="Sixteen pulses per color channel, forty eight per pixel"></svg>

  <div class="rule thin"></div>

  <div class="lower">
    <div class="chips" id="chips">
      <div class="chip" id="chip-r" style="border-top-color:var(--red)">
        <div class="ch">Red</div><div class="bin" id="bin-r">00000000</div><div class="dec" id="dec-r">0</div>
        <div class="slider"><input type="range" id="sl-r" min="0" max="255" value="181" style="--c:var(--red)" aria-label="Red value"></div>
      </div>
      <div class="chip" id="chip-g" style="border-top-color:var(--green)">
        <div class="ch">Green</div><div class="bin" id="bin-g">00000000</div><div class="dec" id="dec-g">0</div>
        <div class="slider"><input type="range" id="sl-g" min="0" max="255" value="92" style="--c:var(--green)" aria-label="Green value"></div>
      </div>
      <div class="chip" id="chip-b" style="border-top-color:var(--bluech)">
        <div class="ch">Blue</div><div class="bin" id="bin-b">00000000</div><div class="dec" id="dec-b">0</div>
        <div class="slider"><input type="range" id="sl-b" min="0" max="255" value="255" style="--c:var(--bluech)" aria-label="Blue value"></div>
      </div>
    </div>

    <div class="pixelbox">
      <div class="pixel"><div class="emit" id="emit"></div></div>
      <div class="cap">One pixel<br>on the strip</div>
    </div>
  </div>

</div>

<script>
(function(){
  var SVGNS = "http://www.w3.org/2000/svg";

  function el(tag, attrs){
    var n = document.createElementNS(SVGNS, tag);
    for(var k in attrs){ n.setAttribute(k, attrs[k]); }
    return n;
  }
  function bits(v, n){
    var s = v.toString(2);
    while(s.length < n){ s = "0" + s; }
    return s;
  }

  var CH = [
    {wide:"RED",   narrow:"R", color:"#e02020", bin:"bin-r", dec:"dec-r", chip:"chip-r"},
    {wide:"GREEN", narrow:"G", color:"#00a03c", bin:"bin-g", dec:"dec-g", chip:"chip-g"},
    {wide:"BLUE",  narrow:"B", color:"#1050e0", bin:"bin-b", dec:"dec-b", chip:"chip-b"}
  ];

  // the auto ramp is continuous: black up through red to white and back
  var CYCLE_MS = 10000;      // one full trip
  var AUTO_FPS = 14;         // how many values a second are put on the wire

  function rampColor(L){
    var m = V().max;
    if(L <= 0.5){
      return {r:Math.round(m * L*2), g:0, b:0};
    }
    var t = (L - 0.5) * 2;
    return {r:m, g:Math.round(m*t), b:Math.round(m*t)};
  }

  // ================= 8 bit: one row of 24 pulses, grouped per channel =================
  function build8(){
    var svg = document.getElementById("wave8");
    var X0 = 22, W = 46, N = 24;
    var YL = 152, YH = 54;
    var H1 = 34, H0 = 12;
    var BIT_MS = 125;

    for(var i=0;i<=N;i++){
      var x = X0 + W*i;
      svg.appendChild(el("line", {x1:x, y1:44, x2:x, y2:162,
        "class": (i%8===0 ? "grp-line" : "cell-line")}));
    }
    for(var g=0;g<3;g++){
      var gx = X0 + W*8*g, gw = W*8;
      svg.appendChild(el("line", {x1:gx+3, y1:176, x2:gx+gw-3, y2:176,
        stroke:CH[g].color, "class":"grp-rule"}));
      var t = el("text", {x:gx+gw/2, y:196, "class":"grp-label", fill:CH[g].color});
      t.textContent = CH[g].wide;
      svg.appendChild(t);
    }

    var trace = el("path", {"class":"trace", pathLength:"1"});
    svg.appendChild(trace);

    var rects = [], texts = [];
    for(var j=0;j<N;j++){
      var r = el("rect", {"class":"fill", x:X0+W*j, y:YH, width:H1, height:YL-YH});
      svg.appendChild(r); rects.push(r);
      var tx = el("text", {"class":"bit", x:X0+W*j, y:38});
      svg.appendChild(tx); texts.push(tx);
    }

    return {
      svg: svg,
      depth: 8,
      max: 255,
      step: 51,
      chanMs: 8 * BIT_MS,

      layoutAll: function(f){
        var s = bits(f.r,8) + bits(f.g,8) + bits(f.b,8);
        var d = "M 0," + YL;
        for(var i=0;i<N;i++){
          var x = X0 + W*i;
          var h = (s[i] === "1") ? H1 : H0;
          d += " L " + x + "," + YL + " L " + x + "," + YH +
               " L " + (x+h) + "," + YH + " L " + (x+h) + "," + YL;
          rects[i].setAttribute("width", h);
          texts[i].setAttribute("x", x + h/2);
          texts[i].textContent = s[i];
        }
        d += " L 1150," + YL;
        trace.setAttribute("d", d);
      },
      setBits: function(on, staggered){
        for(var i=0;i<N;i++){
          var d = staggered ? (i*BIT_MS) + "ms" : "0ms";
          rects[i].style.transitionDelay = d;
          texts[i].style.transitionDelay = d;
          rects[i].style.opacity = on ? 1 : 0;
          texts[i].style.opacity = on ? 1 : 0;
        }
      },
      armTraces: function(){
        trace.style.transition = "none";
        trace.style.strokeDasharray = 1;
        trace.style.strokeDashoffset = 1;
        trace.style.opacity = 1;
      },
      drawTraces: function(){
        trace.style.transition = "stroke-dashoffset " + (N*BIT_MS) + "ms linear";
        trace.style.strokeDashoffset = 0;
      },
      showTraces: function(){
        trace.style.transition = "none";
        trace.style.strokeDasharray = "none";
        trace.style.strokeDashoffset = 0;
        trace.style.opacity = 1;
      },
      fadeTraces: function(){
        trace.style.transition = "opacity 450ms linear";
        trace.style.opacity = 0;
      }
    };
  }

  // ================= 16 bit: three rows of 16 pulses, one per channel =================
  function build16(){
    var svg = document.getElementById("wave16");
    var B = 16;
    var X0 = 78, W = 66;
    var H1 = 48, H0 = 17;
    var ROW_Y = [10, 126, 242];
    var BIT_MS = 62;
    var ROW_MS = B * BIT_MS;

    var rows = [];
    for(var r=0;r<3;r++){
      var base = ROW_Y[r];
      var YH = base + 26;
      var YL = base + 88;

      for(var i=0;i<=B;i++){
        var x = X0 + W*i;
        svg.appendChild(el("line", {x1:x, y1:base+18, x2:x, y2:YL+10, "class":"cell-line"}));
      }

      svg.appendChild(el("rect", {x:14, y:YH, width:5, height:YL-YH, fill:CH[r].color}));
      var tag = el("text", {x:34, y:(YH+YL)/2 + 6, "class":"row-tag", fill:CH[r].color});
      tag.textContent = CH[r].narrow;
      svg.appendChild(tag);

      var tr = el("path", {"class":"trace", pathLength:"1"});
      svg.appendChild(tr);

      var rects = [], texts = [];
      for(var j=0;j<B;j++){
        var rc = el("rect", {"class":"fill", x:X0+W*j, y:YH, width:H1, height:YL-YH});
        svg.appendChild(rc); rects.push(rc);
        var tx = el("text", {"class":"bit", x:X0+W*j, y:base+14});
        svg.appendChild(tx); texts.push(tx);
      }

      rows.push({trace:tr, rects:rects, texts:texts, YH:YH, YL:YL});
    }

    function layoutRow(r, s){
      var row = rows[r];
      var d = "M 0," + row.YL;
      for(var i=0;i<B;i++){
        var x = X0 + W*i;
        var h = (s[i] === "1") ? H1 : H0;
        d += " L " + x + "," + row.YL + " L " + x + "," + row.YH +
             " L " + (x+h) + "," + row.YH + " L " + (x+h) + "," + row.YL;
        row.rects[i].setAttribute("width", h);
        row.texts[i].setAttribute("x", x + h/2);
        row.texts[i].textContent = s[i];
      }
      d += " L 1150," + row.YL;
      row.trace.setAttribute("d", d);
    }

    return {
      svg: svg,
      depth: 16,
      max: 65535,
      step: 1,
      chanMs: ROW_MS,

      layoutAll: function(f){
        layoutRow(0, bits(f.r,16));
        layoutRow(1, bits(f.g,16));
        layoutRow(2, bits(f.b,16));
      },
      setBits: function(on, staggered){
        for(var r=0;r<3;r++){
          for(var i=0;i<B;i++){
            var d = staggered ? ((r*B + i) * BIT_MS) + "ms" : "0ms";
            rows[r].rects[i].style.transitionDelay = d;
            rows[r].texts[i].style.transitionDelay = d;
            rows[r].rects[i].style.opacity = on ? 1 : 0;
            rows[r].texts[i].style.opacity = on ? 1 : 0;
          }
        }
      },
      armTraces: function(){
        for(var r=0;r<3;r++){
          rows[r].trace.style.transition = "none";
          rows[r].trace.style.strokeDasharray = 1;
          rows[r].trace.style.strokeDashoffset = 1;
          rows[r].trace.style.opacity = 1;
        }
      },
      drawTraces: function(){
        for(var r=0;r<3;r++){
          rows[r].trace.style.transition =
            "stroke-dashoffset " + ROW_MS + "ms linear " + (r*ROW_MS) + "ms";
          rows[r].trace.style.strokeDashoffset = 0;
        }
      },
      showTraces: function(){
        for(var r=0;r<3;r++){
          rows[r].trace.style.transition = "none";
          rows[r].trace.style.strokeDasharray = "none";
          rows[r].trace.style.strokeDashoffset = 0;
          rows[r].trace.style.opacity = 1;
        }
      },
      fadeTraces: function(){
        for(var r=0;r<3;r++){
          rows[r].trace.style.transition = "opacity 450ms linear";
          rows[r].trace.style.opacity = 0;
        }
      }
    };
  }

  var V8 = build8(), V16 = build16();
  var depth = 8;
  function V(){ return depth === 8 ? V8 : V16; }

  // ================= shared state =================
  var emit    = document.getElementById("emit");
  var chips   = document.getElementById("chips");
  var sliders = [document.getElementById("sl-r"),
                 document.getElementById("sl-g"),
                 document.getElementById("sl-b")];

  var mode = "auto";
  var gen = 0;
  var cur = {r:181, g:92, b:255};      // always held at the active depth

  function scale(f, from, to){
    if(from === to){ return {r:f.r, g:f.g, b:f.b}; }
    if(to === 16){ return {r:f.r*257, g:f.g*257, b:f.b*257}; }
    return {r:Math.round(f.r/257), g:Math.round(f.g/257), b:Math.round(f.b/257)};
  }
  function light(f, upTo){
    var v = [f.r, f.g, f.b].map(function(x, i){ return i < upTo ? x : 0; });
    if(depth === 16){ v = v.map(function(x){ return x >> 8; }); }
    if(v[0] + v[1] + v[2] === 0){ dark(); return; }
    emit.style.background = "rgb(" + v[0] + "," + v[1] + "," + v[2] + ")";
    emit.style.boxShadow = "0 0 46px 12px rgba(" + v[0] + "," + v[1] + "," + v[2] + ",0.55)";
  }
  function dark(){
    emit.style.background = "#0d0d0d";
    emit.style.boxShadow = "none";
  }
  function showChip(i, on){
    document.getElementById(CH[i].chip).classList.toggle("on", on);
  }
  function setChips(f){
    var v = [f.r, f.g, f.b];
    for(var i=0;i<3;i++){
      document.getElementById(CH[i].bin).textContent = bits(v[i], depth);
      document.getElementById(CH[i].dec).textContent = v[i].toLocaleString("en-US");
    }
  }

  function renderNow(f){
    cur = f;
    V().layoutAll(f);
    setChips(f);
    V().showTraces();
    V().setBits(true, false);
    for(var k=0;k<3;k++){ showChip(k, true); }
    light(f, 3);
  }

  function autoLoop(myGen){
    var t0 = null;
    function step(ts){
      if(myGen !== gen){ return; }
      if(t0 === null){ t0 = ts; }
      var u = (((ts - t0) % CYCLE_MS) / CYCLE_MS);
      var L = u < 0.5 ? u*2 : (1-u)*2;      // 0 to 1 and back
      renderNow(rampColor(L));
      setTimeout(function(){ requestAnimationFrame(step); }, 1000/AUTO_FPS);
    }
    requestAnimationFrame(step);
  }

  // ================= controls =================
  var btn8    = document.getElementById("btn-8");
  var btn16   = document.getElementById("btn-16");
  var btnAuto = document.getElementById("btn-auto");
  var btnMan  = document.getElementById("btn-man");

  sliders.forEach(function(s){
    s.addEventListener("input", function(){
      if(mode !== "manual"){ return; }
      renderNow({r:+sliders[0].value, g:+sliders[1].value, b:+sliders[2].value});
    });
  });

  function loadSliders(f){
    for(var i=0;i<3;i++){
      sliders[i].max = V().max;
      sliders[i].step = V().step;       // 8 bit is stepped on purpose, 16 bit is not
    }
    sliders[0].value = f.r; sliders[1].value = f.g; sliders[2].value = f.b;
  }

  function start(){
    gen++;
    if(mode === "manual"){
      loadSliders(cur);
      renderNow(cur);
    } else {
      autoLoop(gen);
    }
  }

  function setDepth(d){
    if(d === depth){ return; }
    gen++;                                  // cancels any running animation
    var next = scale(cur, depth, d);
    depth = d;
    cur = next;
    btn8.classList.toggle("on", d === 8);
    btn16.classList.toggle("on", d === 16);
    chips.classList.toggle("b16", d === 16);
    V8.svg.classList.toggle("off", d !== 8);
    V16.svg.classList.toggle("off", d !== 16);
    // leave the hidden view clean, so it never flashes a half drawn trace
    (d === 8 ? V16 : V8).setBits(false, false);
    start();
  }

  function setMode(m){
    if(m === mode){ return; }
    mode = m;
    btnAuto.classList.toggle("on", m === "auto");
    btnMan.classList.toggle("on", m === "manual");
    chips.classList.toggle("manual", m === "manual");
    start();
  }

  btn8.addEventListener("click",    function(){ setDepth(8); });
  btn16.addEventListener("click",   function(){ setDepth(16); });
  btnAuto.addEventListener("click", function(){ setMode("auto"); });
  btnMan.addEventListener("click",  function(){ setMode("manual"); });

  // ================= start =================
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){
    mode = "manual";
    btnAuto.classList.remove("on");
    btnMan.classList.add("on");
    chips.classList.add("manual");
  }
  start();
})();
</script>
</body>
</html>
