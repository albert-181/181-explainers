html, body { margin: 0; height: 100%; background: #121113; overflow: hidden; }
#wrap { position: absolute; left: 0; top: 0; width: 1360px; height: 900px; transform-origin: 0 0;
  color: #f2efe8; font-family: Inter, system-ui, sans-serif; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin-top: 8px; font-size: 15px; color: #a9a5ad; }
.totem { position: absolute; left: 60px; top: 110px; width: 320px; height: 760px; box-sizing: border-box;
  background: #ecebe7; border: 2px solid #1b1b1b; border-radius: 4px; }
.row { position: absolute; left: 0; width: 316px; display: flex; justify-content: space-around; align-items: flex-end; }
.fx { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fx span { font-size: 10.5px; color: #2b6cb0; }
.lamp { border: 2px solid #1b1b1b; transition: background-color 600ms ease, box-shadow 600ms ease; }
.mini { position: absolute; left: 16px; top: 236px; width: 284px; height: 85px; box-sizing: border-box;
  border: 2px solid #1b1b1b; background: #000; overflow: hidden; }
.mini iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 555px; border: 0; transform: scale(0.14583); transform-origin: 0 0; pointer-events: none; }
.btn { position: absolute; padding: 0; border-radius: 50%; border: 3px solid #3f6a00; cursor: pointer;
  background: radial-gradient(circle at 40% 35%, #d6ff7a 0%, #9be22d 55%, #6fae0f 100%);
  box-shadow: 0 3px 0 #2f5000; transition: transform 120ms ease, box-shadow 200ms ease; }
.btn:hover { box-shadow: 0 3px 0 #2f5000, 0 0 18px 4px rgba(155,226,45,.55); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2f5000; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.right { position: absolute; left: 440px; top: 110px; width: 880px; }
.bezel { width: 880px; height: 266px; box-sizing: border-box; padding: 8px; background: #050505; border-radius: 6px; box-shadow: 0 0 0 1px #2a282d; }
.big { position: relative; width: 864px; height: 250px; overflow: hidden; }
.big iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 555px; border: 0; transform: scale(0.45); transform-origin: 0 0; pointer-events: none; }
.rail { position: relative; width: 880px; height: 92px; margin-top: 4px; border-bottom: 1px solid #2a282d; }
.lbl { font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #8d8992; }
#status { font-size: 22px; font-weight: 500; line-height: 1.35; min-height: 90px; }
.track { position: relative; width: 880px; height: 44px; }
.track div { position: absolute; }
.ctl { font: 500 14px/1 Inter, sans-serif; color: #f2efe8; background: #232126; border: 1px solid #3a373e; border-radius: 8px; padding: 12px 16px; cursor: pointer; }
.ctl:hover { background: #2e2b32; }
.ctl:focus-visible { outline: 2px solid #c4f25c; outline-offset: 2px; }
label.chk { font-size: 14px; color: #a9a5ad; display: flex; align-items: center; gap: 8px; margin-left: 12px; }
</style>

const SHOW_NAMES = ['red', 'green', 'blue', 'white', 'pastel pink', 'pastel blue', 'pastel yellow', 'pastel lilac'];
const frames = [document.getElementById('frameMini'), document.getElementById('frameBig')];
let hint = 6, invite = 30, last = Date.now(), mode = 'film', idx = 0, sc = 0;

function fit() {
  const s = Math.min(innerWidth / 1360, innerHeight / 900);
  const w = document.getElementById('wrap');
  w.style.transform = 'scale(' + s + ')';
  w.style.left = Math.max(0, (innerWidth - 1360 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

function load() {
  const cfg = JSON.parse(JSON.stringify(CONFIG));
  cfg.idle = Object.assign({}, cfg.idle || {}, { hintAfter: hint, inviteAfter: invite });
  const html = APP_HTML.replace('__RUNTIME_CONFIG__', JSON.stringify(cfg).replace(/</g, '\\u003c'));
  frames.forEach(f => { f.srcdoc = html; });
  last = Date.now(); mode = 'film'; idx = 0; sc = 0; paint();
}

function send(cmd) { frames.forEach(f => { try { f.contentWindow.onCommand(cmd); } catch (e) {} }); }
function simIdle(sec) { frames.forEach(f => { try { f.contentWindow.paletteSimIdle(sec); } catch (e) {} }); }

function press(b) {
  const n = CONFIG.movies.length;
  if (b === 0) { mode = 'film'; idx = (idx + n - 1) % n; send('prev'); }
  else if (b === 1) { mode = 'film'; idx = (idx + 1) % n; send('next'); }
  else { if (mode === 'showcase') sc = (sc + 1) % CONFIG.showcase.colors.length; else { mode = 'showcase'; sc = 0; } send('manual'); }
  last = Date.now(); paint();
}

function colour(i) {
  if (mode === 'showcase') return CONFIG.showcase.colors[sc];
  const p = CONFIG.movies[idx].palette; return p[i % p.length];
}
function lamp(name, w, h, radius, color) {
  return '<div class="fx"><div class="lamp" style="width:' + w + 'px;height:' + h + 'px;border-radius:' + radius + ';background:' + color +
    ';box-shadow:0 0 16px 3px ' + color + '"></div><span>' + name + '</span></div>';
}
function paint() {
  document.getElementById('pixRow').innerHTML = ['G24', 'G36', 'G54', 'G100'].map((n, i) => lamp(n, 22, 170, '3px', colour(i))).join('');
  document.getElementById('linRow').innerHTML = ['Flexwasher', 'Softline', 'Flex silicon', 'Inground'].map((n, i) => lamp(n, 12, 150, '6px', colour(i + 2))).join('');
  document.getElementById('floodRow').innerHTML = [['F36', 44], ['F54', 52], ['F72', 60]].map((f, i) => lamp(f[0], f[1], f[1], '50%', colour(i + 3))).join('');
  const c = colour(1), f = document.getElementById('f120'); f.style.background = c; f.style.boxShadow = '0 0 18px 4px ' + c;
  tick();
}
function tick() {
  const secs = (Date.now() - last) / 1000;
  const stage = secs >= invite ? 2 : secs >= hint ? 1 : 0;
  let t;
  if (stage === 2) t = 'No press for 5 minutes: an invitation appears over the screen. The lights stay as they are, so screen and lights never disagree. Any press acts at once.';
  else if (stage === 1) t = 'No press for 1 minute: the button labels start to pulse and point down at the buttons. Nothing else changes.';
  else if (mode === 'showcase') t = 'Colour showcase, colour ' + (sc + 1) + ' of ' + CONFIG.showcase.colors.length + ': the lights show ' + SHOW_NAMES[sc % SHOW_NAMES.length] + '. Press button 3 again for the next colour; Previous or Next goes back to the films.';
  else t = 'Film ' + (idx + 1) + ' of ' + CONFIG.movies.length + ': the screen shows the still and its palette, the lights play the same palette.';
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = Math.round(Math.min(secs / invite, 1) * 880) + 'px';
}
setInterval(tick, 500);

document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => press(Number(b.dataset.b))));
document.getElementById('skip1').onclick = () => { last = Date.now() - hint * 1000 - 200; simIdle(hint + 0.2); tick(); };
document.getElementById('skip2').onclick = () => { last = Date.now() - invite * 1000 - 200; simIdle(invite + 0.2); tick(); };
document.getElementById('reset').onclick = load;
document.getElementById('real').onchange = (e) => { hint = e.target.checked ? 60 : 6; invite = e.target.checked ? 300 : 30; load(); };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') press(0);
  else if (e.key === 'ArrowRight') press(1);
  else if (e.key === 'm' || e.key === 'M') press(2);
});
load();
</script>
